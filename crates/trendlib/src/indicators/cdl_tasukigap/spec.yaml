name: cdl_tasukigap
title: Tasuki Gap
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: cdl_tasukigap
    dtype: int32
    plot: pattern
    doc: A gap, then a bar of the other colour that opens inside the gapping body and closes into the gap without filling it
talib:
  name: CDLTASUKIGAP
  params: {}
  outputs: [integer]
references:
  - Steve Nison, Japanese Candlestick Charting Techniques, New York Institute of Finance, 1991
see_also: [cdl_xsidegap3methods, cdl_gapsidesidewhite, cdl_risefall3methods]
