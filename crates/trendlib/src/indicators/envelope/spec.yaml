name: envelope
title: Moving Average Envelope
group: overlap
flags: [overlap]
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 20
    min: 2
    max: 100000
    doc: Bars of the simple moving average
  - name: percent
    type: float
    default: 10.0
    min: 0.0
    doc: Percent each band sits from the average
outputs:
  - name: envelope_upper
    dtype: float64
    plot: upper_band
    doc: The average raised by percent
  - name: envelope_middle
    dtype: float64
    plot: middle_band
    doc: The simple moving average
  - name: envelope_lower
    dtype: float64
    plot: lower_band
    doc: The average lowered by percent
references:
  - TradingView, Envelope
see_also: [sma, bbands, kc]
