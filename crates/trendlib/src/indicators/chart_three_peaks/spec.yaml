name: chart_three_peaks
title: Three Peaks
group: chart
flags: [chart_pattern, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 120
    min: 2
    max: 100000
    doc: Bars back the first top may have been confirmed
  - name: pivot_n
    type: int
    default: 5
    min: 1
    max: 100000
    doc: Bars on each side a swing high must be at least as high as, and a swing low at least as low as
  - name: min_separation
    type: int
    default: 8
    min: 1
    max: 100000
    doc: Fewest bars between one top's confirmation and the next
outputs:
  - name: chart_three_peaks
    dtype: int32
    plot: pattern
    doc: Three falling swing highs and a close beyond the span between them
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.three_peaks (oracle P)
see_also: [chart_three_valleys, chart_triple_top]
