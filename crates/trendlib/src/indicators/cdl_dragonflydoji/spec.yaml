name: cdl_dragonflydoji
title: Dragonfly Doji
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: cdl_dragonflydoji
    dtype: int32
    plot: pattern
    doc: A doji that opened and closed at the top of its range, with a long tail below
talib:
  name: CDLDRAGONFLYDOJI
  params: {}
  outputs: [integer]
references:
  - Steve Nison, Japanese Candlestick Charting Techniques, New York Institute of Finance, 1991
see_also: [cdl_gravestonedoji, cdl_takuri, cdl_doji]
