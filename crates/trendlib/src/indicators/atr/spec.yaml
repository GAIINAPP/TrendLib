name: atr
title: Average True Range
group: volatility
flags: [unstable]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 14
    min: 1
    max: 100000
    doc: Number of bars the true ranges are averaged over
outputs:
  - name: atr
    dtype: float64
    plot: line
    doc: Wilder average of the true range
talib:
  name: ATR
  params: {period: timeperiod}
  outputs: [real]
references:
  - J. Welles Wilder Jr., New Concepts in Technical Trading Systems, Trend Research, 1978, chapter 2
see_also: [trange, natr]
