name: maxindex
title: Index of the Rolling Maximum
group: statistic
flags: [absolute_index]
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 30
    min: 2
    max: 100000
    doc: Number of bars the extreme is taken over
outputs:
  - name: maxindex
    dtype: int32
    plot: line
    doc: Row of the input holding the highest value of the last period bars
talib:
  name: MAXINDEX
  params: {period: timeperiod}
  outputs: [integer]
references:
  - Steven B. Achelis, Technical Analysis from A to Z, McGraw-Hill, 2000
see_also: [max, minmaxindex]
