name: chart_measured_move_up
title: Measured Move Up
group: chart
flags: [chart_pattern, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: pivot_n
    type: int
    default: 5
    min: 1
    max: 100000
    doc: Bars on each side a swing high must be at least as high as, and a swing low at least as low as
  - name: leg_tol
    type: float
    default: 0.2
    min: 0.0
    doc: How far the two legs' lengths may differ, as a fraction of the first
outputs:
  - name: chart_measured_move_up
    dtype: int32
    plot: pattern
    doc: Two rising legs of about equal length, on the bar the second ends
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.measured_move_up (oracle P)
see_also: [chart_measured_move_down, chart_bull_flag]
