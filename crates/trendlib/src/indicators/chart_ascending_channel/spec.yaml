name: chart_ascending_channel
title: Ascending Channel
group: chart
flags: [chart_pattern, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 80
    min: 2
    max: 100000
    doc: Bars back a swing point may have been placed and still be on a line
  - name: pivot_n
    type: int
    default: 4
    min: 1
    max: 100000
    doc: Bars on each side a swing high must be at least as high as, and a swing low at least as low as
  - name: parallel_tol
    type: float
    default: 0.25
    min: 0.0
    doc: How far the two slopes may differ, as a fraction of the lower line's
outputs:
  - name: chart_ascending_channel
    dtype: int32
    plot: pattern
    doc: A close below the lower of two rising lines of about the same slope
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - Robert D. Edwards and John Magee, Technical Analysis of Stock Trends, 9th edition, CRC Press, 2007
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.channel_asc (oracle P)
see_also: [chart_descending_channel, chart_rising_wedge]
