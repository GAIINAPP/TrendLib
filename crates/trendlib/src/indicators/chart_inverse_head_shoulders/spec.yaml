name: chart_inverse_head_shoulders
title: Inverse Head and Shoulders
group: chart
flags: [chart_pattern, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 150
    min: 2
    max: 100000
    doc: Bars back the shoulders and head may have been confirmed, and bars the neckline waits for a close through it
  - name: pivot_n
    type: int
    default: 5
    min: 1
    max: 100000
    doc: Bars on each side a swing high must be at least as high as, and a swing low at least as low as
  - name: shoulder_tol
    type: float
    default: 0.05
    min: 0.0
    doc: How far apart the shoulders may be, as a fraction of the larger
  - name: min_separation
    type: int
    default: 8
    min: 1
    max: 100000
    doc: Fewest bars between the confirmations of a shoulder and the head
outputs:
  - name: chart_inverse_head_shoulders
    dtype: int32
    plot: pattern
    doc: The first close above the neckline after a head below two shoulders of about the same depth
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - Robert D. Edwards and John Magee, Technical Analysis of Stock Trends, 9th edition, CRC Press, 2007
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.hs_bottom (oracle P)
see_also: [chart_head_shoulders, chart_double_bottom, chart_triple_bottom]
