name: dpo
title: Detrended Price Oscillator
group: momentum
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 20
    min: 2
    max: 100000
    doc: Number of bars the trend is measured over
outputs:
  - name: dpo
    dtype: float64
    plot: histogram
    doc: How far an earlier value sat above or below the current average
talib:
  name: DPO
  params: {period: timeperiod}
  outputs: [real]
references:
  - Steven B. Achelis, Technical Analysis from A to Z, McGraw-Hill, 2000
see_also: [sma, roc]
