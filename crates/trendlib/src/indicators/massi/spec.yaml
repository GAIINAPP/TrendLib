name: massi
title: Mass Index
group: volatility
flags: [unstable, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
params:
  - name: fast_period
    type: int
    default: 9
    min: 2
    max: 100000
    doc: Number of bars each exponential stage uses
  - name: slow_period
    type: int
    default: 25
    min: 2
    max: 100000
    doc: Number of ratios summed
outputs:
  - name: massi
    dtype: float64
    plot: line
    doc: Sum of the ratio between a smoothed range and a twice-smoothed one
talib:
  name: MASSI
  params: {fast_period: fastperiod, slow_period: slowperiod}
  outputs: [real]
references:
  - Donald Dorsey, The Mass Index, Technical Analysis of Stocks and Commodities, June 1992
see_also: [cvi, atr, bbands]
