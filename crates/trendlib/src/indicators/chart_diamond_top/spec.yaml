name: chart_diamond_top
title: Diamond Top
group: chart
flags: [chart_pattern, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 60
    min: 2
    max: 100000
    doc: Bars back the shape may reach
  - name: pivot_n
    type: int
    default: 4
    min: 1
    max: 100000
    doc: Bars on each side a swing high must be at least as high as, and a swing low at least as low as
outputs:
  - name: chart_diamond_top
    dtype: int32
    plot: pattern
    doc: A close below a diamond's lower line after it broadened and narrowed
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - Robert D. Edwards and John Magee, Technical Analysis of Stock Trends, 9th edition, CRC Press, 2007
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.diamond_top (oracle P)
see_also: [chart_diamond_bottom, chart_broadening, chart_symmetrical_triangle]
