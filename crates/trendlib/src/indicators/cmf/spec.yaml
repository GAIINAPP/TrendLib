name: cmf
title: Chaikin Money Flow
group: volume
flags: [nan_inf_output]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
  - name: volume
    kind: volume
params:
  - name: period
    type: int
    default: 20
    min: 2
    max: 100000
    doc: Number of bars the flows are summed over
outputs:
  - name: cmf
    dtype: float64
    plot: histogram
    doc: Share of recent volume that traded in the upper half of its bars
talib:
  name: CMF
  params: {period: timeperiod}
  outputs: [real]
references:
  - Marc Chaikin, as described in Steven B. Achelis, Technical Analysis from A to Z, McGraw-Hill, 2000
see_also: [mfi, ad, obv]
