name: frama
title: Fractal Adaptive Moving Average
group: overlap
flags: [overlap, unstable]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
params:
  - name: period
    type: int
    default: 16
    min: 2
    max: 100000
    doc: Bars the fractal dimension is measured over, split into two halves
outputs:
  - name: frama
    dtype: float64
    plot: line
    doc: Exponential average whose step follows the fractal dimension
references:
  - John Ehlers, FRAMA - Fractal Adaptive Moving Average, Technical Analysis of Stocks & Commodities, 2005
see_also: [kama, mama, ema]
