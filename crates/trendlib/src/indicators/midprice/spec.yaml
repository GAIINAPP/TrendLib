name: midprice
title: Midprice
group: overlap
flags: [overlap]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
params:
  - name: period
    type: int
    default: 14
    min: 2
    max: 100000
    doc: Number of bars the highest high and lowest low are taken from
outputs:
  - name: midprice
    dtype: float64
    plot: line
    doc: Halfway between the highest high and the lowest low in the window
talib:
  name: MIDPRICE
  params: {period: timeperiod}
  outputs: [real]
references:
  - TA-Lib, ta_MIDPRICE.c
see_also: [midpoint, donchian]
