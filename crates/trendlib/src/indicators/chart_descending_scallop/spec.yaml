name: chart_descending_scallop
title: Descending Scallop
group: chart
flags: [chart_pattern]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 25
    min: 2
    max: 100000
    doc: Bars the scallop spans
outputs:
  - name: chart_descending_scallop
    dtype: int32
    plot: pattern
    doc: A close below a ∩-shaped rise and fall of the last period closes
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.scallop_desc (oracle P)
see_also: [chart_ascending_scallop, chart_rounding_bottom]
