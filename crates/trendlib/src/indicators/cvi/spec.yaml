name: cvi
title: Chaikin Volatility
group: volatility
flags: [unstable, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
params:
  - name: period
    type: int
    default: 10
    min: 2
    max: 100000
    doc: Number of bars the range is smoothed over
  - name: roc_period
    type: int
    default: 10
    min: 1
    max: 100000
    doc: Bars back the smoothed range is compared with
outputs:
  - name: cvi
    dtype: float64
    plot: line
    doc: Percentage change in the smoothed high-low range
talib:
  name: CVI
  params: {period: timeperiod, roc_period: rocperiod}
  outputs: [real]
references:
  - Marc Chaikin, as described in Steven B. Achelis, Technical Analysis from A to Z, McGraw-Hill, 2000
see_also: [atr, natr, adr]
