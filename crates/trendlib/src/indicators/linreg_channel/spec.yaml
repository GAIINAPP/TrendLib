name: linreg_channel
title: Linear Regression Channel
group: statistic
flags: [overlap, nan_inf_output]
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 100
    min: 2
    max: 100000
    doc: Bars the line is fitted over
  - name: deviation
    type: float
    default: 2.0
    min: 0.0
    doc: Standard deviations of the residuals each band sits from the line
outputs:
  - name: linreg_channel_upper
    dtype: float64
    plot: upper_band
    doc: The line's end plus deviation residual standard deviations
  - name: linreg_channel_middle
    dtype: float64
    plot: middle_band
    doc: The least-squares line's value at the newest bar
  - name: linreg_channel_lower
    dtype: float64
    plot: lower_band
    doc: The line's end minus deviation residual standard deviations
references:
  - TradingView, Linear Regression Channel
see_also: [linearreg, stddev, bbands]
