name: typprice
title: Typical Price
group: price
flags: [overlap]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: typprice
    dtype: float64
    plot: line
    doc: The average of the high, the low and the close
talib:
  name: TYPPRICE
  params: {}
  outputs: [real]
references:
  - Steven B. Achelis, Technical Analysis from A to Z, McGraw-Hill, 2000
