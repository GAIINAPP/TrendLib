name: cdl_thrusting
title: Thrusting Pattern
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: cdl_thrusting
    dtype: int32
    plot: pattern
    doc: A white bar that opened under the previous low and closed inside the black body but short of its middle
talib:
  name: CDLTHRUSTING
  params: {}
  outputs: [integer]
references:
  - Steve Nison, Japanese Candlestick Charting Techniques, New York Institute of Finance, 1991
see_also: [cdl_piercing, cdl_onneck, cdl_inneck]
