name: ift_rsi
title: Inverse Fisher Transform of RSI
group: momentum
flags: [path_dependent, unstable, nan_inf_output]
inputs:
  - name: source
    kind: series
params:
  - name: rsi_period
    type: int
    default: 5
    min: 2
    max: 100000
    doc: Bars of the RSI
  - name: wma_period
    type: int
    default: 9
    min: 2
    max: 100000
    doc: Bars of the weighted average of the rescaled RSI
outputs:
  - name: ift_rsi
    dtype: float64
    plot: line
    doc: The transformed RSI, between -1 and 1
references:
  - John Ehlers, Cybernetic Analysis for Stocks and Futures, Wiley, 2004
  - finta 1.3, finta.TA (oracle F)
see_also: [rsi, stochrsi, wma]
