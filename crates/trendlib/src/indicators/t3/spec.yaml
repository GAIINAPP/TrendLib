name: t3
title: Tillson T3
group: overlap
flags: [overlap, unstable, path_dependent]
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 5
    min: 1
    max: 100000
    doc: Number of bars each of the six exponential stages uses
  - name: v_factor
    type: float
    default: 0.7
    min: 0.0
    max: 1.0
    doc: How much of the lag the combination subtracts back out
outputs:
  - name: t3
    dtype: float64
    plot: line
    doc: Six exponential stages combined to cancel most of their lag
talib:
  name: T3
  params: {period: timeperiod, v_factor: vfactor}
  outputs: [real]
references:
  - Tim Tillson, Smoothing Techniques for More Accurate Signals, Technical Analysis of Stocks and Commodities, January 1998
see_also: [dema, tema, ema]
