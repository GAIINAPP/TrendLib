name: minmaxindex
title: Indices of the Rolling Minimum and Maximum
group: statistic
flags: [absolute_index]
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 30
    min: 2
    max: 100000
    doc: Number of bars the extremes are taken over
outputs:
  - name: minmaxindex_min_index
    dtype: int32
    plot: line
    doc: Row of the input holding the lowest value of the last period bars
  - name: minmaxindex_max_index
    dtype: int32
    plot: line
    doc: Row of the input holding the highest value of the last period bars
talib:
  name: MINMAXINDEX
  params: {period: timeperiod}
  outputs: [minidx, maxidx]
references:
  - Steven B. Achelis, Technical Analysis from A to Z, McGraw-Hill, 2000
see_also: [maxindex, minindex]
