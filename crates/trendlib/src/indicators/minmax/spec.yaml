name: minmax
title: Rolling Minimum and Maximum
group: statistic
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 30
    min: 2
    max: 100000
    doc: Number of bars the extremes are taken over
outputs:
  - name: minmax_min
    dtype: float64
    plot: lower_band
    doc: The lowest value of the last period bars
  - name: minmax_max
    dtype: float64
    plot: upper_band
    doc: The highest value of the last period bars
talib:
  name: MINMAX
  params: {period: timeperiod}
  outputs: [min, max]
references:
  - Steven B. Achelis, Technical Analysis from A to Z, McGraw-Hill, 2000
see_also: [max, min]
