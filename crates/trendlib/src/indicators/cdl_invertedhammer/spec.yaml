name: cdl_invertedhammer
title: Inverted Hammer
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: cdl_invertedhammer
    dtype: int32
    plot: pattern
    doc: A short body with a long wick above it, opening below the previous body
talib:
  name: CDLINVERTEDHAMMER
  params: {}
  outputs: [integer]
references:
  - Steve Nison, Japanese Candlestick Charting Techniques, New York Institute of Finance, 1991
see_also: [cdl_shootingstar, cdl_hammer, cdl_hangingman]
