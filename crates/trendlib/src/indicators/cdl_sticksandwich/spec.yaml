name: cdl_sticksandwich
title: Stick Sandwich
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: cdl_sticksandwich
    dtype: int32
    plot: pattern
