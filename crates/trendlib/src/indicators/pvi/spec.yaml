name: pvi
title: Positive Volume Index
group: volume
flags: [path_dependent]
inputs:
  - name: close
    kind: close
  - name: volume
    kind: volume
outputs:
  - name: pvi
    dtype: float64
    plot: line
    doc: Index that only moves on bars where volume rises
talib:
  name: PVI
  params: {}
  outputs: [real]
references:
  - Paul L. Dysart, as described in Norman G. Fosback, Stock Market Logic, Dearborn, 1976
see_also: [nvi, obv, pvt]
