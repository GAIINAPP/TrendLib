name: adxr
title: Average Directional Movement Index Rating
group: momentum
flags: [unstable]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 14
    min: 2
    max: 100000
    doc: Number of bars the movement is accumulated over
outputs:
  - name: adxr
    dtype: float64
    plot: line
    doc: The average index now and as it stood period minus one bars ago, averaged
talib:
  name: ADXR
  params: {period: timeperiod}
  outputs: [real]
references:
  - J. Welles Wilder Jr., New Concepts in Technical Trading Systems, Trend Research, 1978
see_also: [adx, atr]
