name: fosc
title: Forecast Oscillator
group: statistic
flags: [nan_inf_output]
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 5
    min: 2
    max: 100000
    doc: Number of bars the forecast is fitted over
outputs:
  - name: fosc
    dtype: float64
    plot: line
    doc: How far the value came in above or below the forecast, as a percentage
talib:
  name: FOSC
  params: {period: timeperiod}
  outputs: [real]
references:
  - Tushar S. Chande and Stanley Kroll, The New Technical Trader, Wiley, 1994
see_also: [tsf, linearreg, linearreg_slope]
