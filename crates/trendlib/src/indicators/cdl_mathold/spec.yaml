name: cdl_mathold
title: Mat Hold
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: penetration
    type: float
    default: 0.5
    min: 0.0
    doc: How far into the previous body the close has to travel, as a fraction of it
outputs:
  - name: cdl_mathold
    dtype: int32
    plot: pattern
    doc: A long white bar, three small ones drifting back without undoing it, then another long white one
talib:
  name: CDLMATHOLD
  params: {penetration: penetration}
  outputs: [integer]
references:
  - Steve Nison, Japanese Candlestick Charting Techniques, New York Institute of Finance, 1991
see_also: [cdl_risefall3methods, cdl_breakaway, cdl_xsidegap3methods]
