  name: CDLSPINNINGTOP
  params: {}
  outputs: [integer]
references:
  - Steve Nison, Japanese Candlestick Charting Techniques, New York Institute of Finance, 1991
see_also: [cdl_highwave, cdl_doji, cdl_shortline]
