name: cdl_spinningtop
title: Spinning Top
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: cdl_spinningtop
    dtype: int32
    plot: pattern
