name: cdl_doji
title: Doji
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: cdl_doji
    dtype: int32
    plot: pattern
    doc: A bar whose open and close are close enough together to count as the same price
talib:
  name: CDLDOJI
  params: {}
  outputs: [integer]
references:
  - Steve Nison, Japanese Candlestick Charting Techniques, New York Institute of Finance, 1991
see_also: [cdl_dojistar, cdl_longleggeddoji, cdl_spinningtop]
