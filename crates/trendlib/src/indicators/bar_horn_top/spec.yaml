name: bar_horn_top
title: Horn Top
group: bars
flags: [chart_pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: tol
    type: float
    default: 0.02
    min: 0.0
    doc: How far apart the two horns' highs may be, as a fraction
outputs:
  - name: bar_horn_top
    dtype: int32
    plot: pattern
    doc: Two matching highs two bars apart with a lower bar between
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.horn_top (oracle P)
see_also: [bar_horn_bottom, bar_pipe_top]
