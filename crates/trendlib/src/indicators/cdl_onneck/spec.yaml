name: cdl_onneck
title: On Neck Pattern
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: cdl_onneck
    dtype: int32
    plot: pattern
    doc: A white bar that opened under the previous low and closed back at it
talib:
  name: CDLONNECK
  params: {}
  outputs: [integer]
references:
  - Steve Nison, Japanese Candlestick Charting Techniques, New York Institute of Finance, 1991
see_also: [cdl_inneck, cdl_thrusting, cdl_piercing]
