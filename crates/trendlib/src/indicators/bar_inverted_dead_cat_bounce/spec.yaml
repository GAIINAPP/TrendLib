name: bar_inverted_dead_cat_bounce
title: Inverted Dead-Cat Bounce
group: bars
flags: [chart_pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: rise_pct
    type: float
    default: 0.1
    min: 0.0
    doc: Smallest rise that starts the pattern, as a fraction
  - name: pullback_pct
    type: float
    default: 0.5
    min: 0.0
    doc: Largest share of the rise the pullback may give back
  - name: period
    type: int
    default: 15
    min: 2
    max: 100000
    doc: Bars the rise and pullback must fit in
outputs:
  - name: bar_inverted_dead_cat_bounce
    dtype: int32
    plot: pattern
    doc: A shallow pullback after a sharp rise
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.dead_cat_bounce_inv (oracle P)
see_also: [bar_dead_cat_bounce, chart_bull_flag]
