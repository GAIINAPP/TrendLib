name: macdfix
title: MACD with Fixed Periods
group: momentum
flags: [unstable, path_dependent]
inputs:
  - name: source
    kind: series
params:
  - name: signal_period
    type: int
    default: 9
    min: 1
    max: 100000
    doc: Number of bars the signal line is smoothed over
outputs:
  - name: macdfix_macd
    dtype: float64
    plot: line
    doc: Fast exponential average minus the slow one
  - name: macdfix_signal
    dtype: float64
    plot: line
    doc: Exponential average of the MACD line
  - name: macdfix_hist
    dtype: float64
    plot: histogram
    doc: MACD line minus the signal line
talib:
  name: MACDFIX
  params: {signal_period: signalperiod}
  outputs: [macd, macdsignal, macdhist]
references:
  - Gerald Appel, Technical Analysis - Power Tools for Active Investors, FT Press, 2005
see_also: [macd, macdext]
