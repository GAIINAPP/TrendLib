name: chart_v_top
title: V-Top
group: chart
flags: [chart_pattern]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 10
    min: 2
    max: 100000
    doc: Bars each arm of the inverted V spans
  - name: min_rise
    type: float
    default: 0.05
    min: 0.0
    doc: Smallest rise into the top, as a fraction
outputs:
  - name: chart_v_top
    dtype: int32
    plot: pattern
    doc: An inverted V in the last period closes
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.v_top (oracle P)
see_also: [chart_v_bottom, chart_rounding_top]
