name: elder_impulse
title: Elder Impulse System
group: momentum
flags: [unstable]
inputs:
  - name: source
    kind: series
params:
  - name: ema_period
    type: int
    default: 13
    min: 2
    max: 100000
    doc: Bars of the trend average
  - name: fast_period
    type: int
    default: 12
    min: 2
    max: 100000
    doc: Bars of MACD's fast average
  - name: slow_period
    type: int
    default: 26
    min: 2
    max: 100000
    doc: Bars of MACD's slow average
  - name: signal_period
    type: int
    default: 9
    min: 1
    max: 100000
    doc: Bars of MACD's signal average
outputs:
  - name: elder_impulse
    dtype: int32
    plot: direction
    doc: 1 when the average and the MACD histogram both rose, -1 when both fell, else 0
references:
  - Alexander Elder, Come Into My Trading Room, Wiley, 2002
see_also: [macd, ema, supertrend]
