name: harmonic_wolfe_wave_bearish
title: Bearish Wolfe Wave
group: harmonic
flags: [chart_pattern, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 60
    min: 2
    max: 100000
    doc: Bars back the pattern's first swing point may have been confirmed
  - name: pivot_n
    type: int
    default: 4
    min: 1
    max: 100000
    doc: Bars on each side a swing high must be at least as high as, and a swing low at least as low as
outputs:
  - name: harmonic_wolfe_wave_bearish
    dtype: int32
    plot: pattern
    doc: A fifth swing high beyond the 1-3 line, and a close back across it
references:
  - Bill Wolfe and Linda Raschke, Wolfe Waves, Technical Analysis of Stocks & Commodities, 1995
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.wolfe_wave_bear (oracle P)
see_also: [harmonic_wolfe_wave_bullish, chart_rising_wedge]
