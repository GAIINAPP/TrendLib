name: roc
title: Rate of Change
group: momentum
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 10
    min: 1
    max: 100000
    doc: Number of bars back the comparison is made to
outputs:
  - name: roc
    dtype: float64
    plot: line
    doc: Percentage change from the value period bars ago
talib:
  name: ROC
  params: {period: timeperiod}
  outputs: [real]
references:
  - Martin J. Pring, Technical Analysis Explained, McGraw-Hill, 2014, chapter 13
see_also: [rsi, macd]
