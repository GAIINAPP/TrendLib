name: chart_bull_pennant
title: Bull Pennant
group: chart
flags: [chart_pattern, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 15
    min: 2
    max: 100000
    doc: Bars the pennant spans after its pole
  - name: pivot_n
    type: int
    default: 3
    min: 1
    max: 100000
    doc: Bars on each side a swing high must be at least as high as, and a swing low at least as low as
  - name: pole_bars
    type: int
    default: 10
    min: 1
    max: 100000
    doc: Bars the pole is measured over
  - name: min_pole
    type: float
    default: 0.05
    min: 0.0
    doc: Smallest rise the pole must make, as a fraction of its first close
outputs:
  - name: chart_bull_pennant
    dtype: int32
    plot: pattern
    doc: A close above a narrowing pennant that follows a sharp rise
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - Robert D. Edwards and John Magee, Technical Analysis of Stock Trends, 9th edition, CRC Press, 2007
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.pennant_bull (oracle P)
see_also: [chart_bear_pennant, chart_bull_flag, chart_symmetrical_triangle]
