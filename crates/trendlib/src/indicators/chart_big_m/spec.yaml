name: chart_big_m
title: Big M
group: chart
flags: [chart_pattern, path_dependent]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
params:
  - name: period
    type: int
    default: 150
    min: 2
    max: 100000
    doc: Bars back the first top may have been confirmed
  - name: pivot_n
    type: int
    default: 7
    min: 1
    max: 100000
    doc: Bars on each side a swing high must be at least as high as, and a swing low at least as low as
  - name: tol
    type: float
    default: 0.03
    min: 0.0
    doc: How far apart the tops may be, as a fraction of the larger
  - name: min_sep
    type: int
    default: 15
    min: 1
    max: 100000
    doc: Fewest bars between the two tops' confirmations
outputs:
  - name: chart_big_m
    dtype: int32
    plot: pattern
    doc: A close below the neckline of a wide double top
references:
  - Thomas N. Bulkowski, Encyclopedia of Chart Patterns, 2nd edition, Wiley, 2005
  - ta-patterns 1.2.1, ta_patterns.chart_patterns.big_m (oracle P)
see_also: [chart_double_top, chart_big_w]
