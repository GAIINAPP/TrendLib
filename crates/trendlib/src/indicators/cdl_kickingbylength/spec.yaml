name: cdl_kickingbylength
title: Kicking by Length
group: patterns
flags: [pattern]
inputs:
  - name: open
    kind: open
  - name: high
    kind: high
  - name: low
    kind: low
  - name: close
    kind: close
outputs:
  - name: cdl_kickingbylength
    dtype: int32
    plot: pattern
    doc: A kicking pattern answered with the colour of the longer of its two bodies
talib:
  name: CDLKICKINGBYLENGTH
  params: {}
  outputs: [integer]
references:
  - Steve Nison, Japanese Candlestick Charting Techniques, New York Institute of Finance, 1991
see_also: [cdl_kicking, cdl_marubozu, cdl_belthold]
