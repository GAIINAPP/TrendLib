name: plus_dm
title: Plus Directional Movement
group: momentum
flags: [unstable]
inputs:
  - name: high
    kind: high
  - name: low
    kind: low
params:
  - name: period
    type: int
    default: 14
    min: 1
    max: 100000
    doc: Number of bars the movement is accumulated over
outputs:
  - name: plus_dm
    dtype: float64
    plot: line
    doc: Wilder's running total of upward directional movement
talib:
  name: PLUS_DM
  params: {period: timeperiod}
  outputs: [real]
references:
  - J. Welles Wilder Jr., New Concepts in Technical Trading Systems, Trend Research, 1978
see_also: [adx, atr]
