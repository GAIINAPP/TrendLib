name: tema
title: Triple Exponential Moving Average
group: overlap
flags: [overlap, unstable]
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 30
    min: 1
    max: 100000
    doc: Number of bars each exponential stage is derived from
outputs:
  - name: tema
    dtype: float64
    plot: line
    doc: Exponential average with lag removed through three stages
talib:
  name: TEMA
  params: {period: timeperiod}
  outputs: [real]
references:
  - Patrick G. Mulloy, Smoothing Data with Faster Moving Averages, Technical Analysis of Stocks and Commodities, February 1994
see_also: [ema, sma]
