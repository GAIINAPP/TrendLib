name: midpoint
title: Midpoint
group: overlap
flags: [overlap]
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 14
    min: 2
    max: 100000
    doc: Number of bars the highest and lowest values are taken from
outputs:
  - name: midpoint
    dtype: float64
    plot: line
    doc: Halfway between the highest and lowest value in the window
talib:
  name: MIDPOINT
  params: {period: timeperiod}
  outputs: [real]
references:
  - TA-Lib, ta_MIDPOINT.c
see_also: [midprice, donchian]
