name: midpoint
title: Midpoint over Period
group: overlap
flags: [overlap]
inputs:
  - name: source
    kind: series
params:
  - name: period
    type: int
    default: 14
    min: 2
    max: 100000
    doc: Number of bars the range is taken over
outputs:
  - name: midpoint
    dtype: float64
    plot: line
    doc: Halfway between the highest and lowest value of the last period bars
talib:
  name: MIDPOINT
  params: {period: timeperiod}
  outputs: [real]
references:
  - Steven B. Achelis, Technical Analysis from A to Z, McGraw-Hill, 2000
see_also: [midprice, minmax]
