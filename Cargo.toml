[workspace]
members = ["crates/trendlib", "crates/trendlib-py", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GAIINAPP/TrendLib"
authors = ["GAIIN Technologies Private Limited and TrendLib contributors"]

[workspace.dependencies]
numpy = "0.29"
pyo3 = "0.29"
trendlib = { path = "crates/trendlib", version = "0.0.0" }

[profile.release]
lto = "thin"
codegen-units = 1
